server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin trick as tool_layer/frontend/nginx.conf: the browser
    # never makes a cross-origin request to the dashboard backend, so no
    # CORS configuration is needed there either. "dashboard-backend" is
    # the DNS alias the backend container needs (--link or a shared
    # Docker network) — see README_OPTIMIZATION_DASHBOARD.md's run
    # instructions.
    location /api/ {
        proxy_pass http://dashboard-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
