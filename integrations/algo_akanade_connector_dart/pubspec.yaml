name: algo_akanade_connector
description: >
  Reusable Dart/Flutter client for ALGO AKANADE's REST API (auth, chat/agents,
  Train Algo AI) — for any Flutter app other than tool_layer_akanade/mobile
  (which has its own implementation) that wants the same integration.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  http: ^1.2.0

dev_dependencies:
  test: ^1.25.0
  lints: ^3.0.0
