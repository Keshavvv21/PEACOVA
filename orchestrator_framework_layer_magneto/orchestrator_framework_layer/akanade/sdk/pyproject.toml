[project]
name = "gmaofn-client"
version = "0.2.0"
description = "External Python SDK for a deployed ALGO AKANADE chatbot's REST API"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gmaofn_client"]
