# Test Asset Layer (§A) — versioned gold-answer + rubric set for the
# candidate-selection pipeline (scripts/eval/harness.py). Six categories,
# matching the two scoring lanes in scripts/eval/harness.py:
#   deterministic (exact/regex/schema) — extraction, classification, structured_output
#   llm_judge (Claude-as-referee, or human spot-check)  — reasoning, planning, complex_reasoning
#
# Starter set: 32 items (not the diagram's ~100x2 target) — real,
# hand-written, grounded in this app's actual PM-assistant domain, not
# placeholder filler. Expand toward 100 by adding more items in the same
# shape; nothing downstream (harness/aggregate/decide) assumes a fixed count.
#
# Every item is self-contained (context inlined in the prompt) — these
# measure a CANDIDATE MODEL's raw reasoning/extraction quality on
# PM-shaped tasks, not this app's live tool-calling integration (that's
# covered by tests/test_agent_flows.py instead).

- id: extraction_001
  category: extraction
  scoring_type: deterministic
  match: exact
  gold_answer: "3"
  messages:
    - role: system
      content: You are a PM assistant. Answer using only the data given. Reply with just the answer, no explanation.
    - role: user
      content: "Projects: Alpha (active), Beta (active), Gamma (archived), Delta (active). How many active projects are there?"

- id: extraction_002
  category: extraction
  scoring_type: deterministic
  match: exact
  gold_answer: "Priya"
  messages:
    - role: system
      content: You are a PM assistant. Answer using only the data given. Reply with just the answer, no explanation.
    - role: user
      content: "Tasks - T1: assignee=Raj, due=2026-08-20. T2: assignee=Priya, due=2026-08-18. T3: assignee=Sam, due=2026-08-25. Who has the earliest due date?"

